[workspace]
resolver = "2"
members = [
    "crates/csv-core",
    "crates/csv-protocol",
    "crates/csv-worker",
    "crates/csv-preview",
    "crates/csv-viewer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Maria"]

[workspace.dependencies]
encoding_rs = "=0.8.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
csv = "1.4"
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1

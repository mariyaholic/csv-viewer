name: CI
# One validation run per PR; branch pushes no longer duplicate PR runs.
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
permissions:
  contents: read
jobs:
  # 07A-13: the platform-portable regression net (csv-core, csv-protocol,
  # csv-worker, the cfg-gated parts of csv-preview and csv-viewer). The FFI
  # module is Windows-only by cfg, so a cheap Linux unit-test job catches
  # portable regressions without a Windows runner.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0
        with:
          toolchain: 1.85.0
      - run: python3 -m unittest discover -s tools -p 'test_packaging.py'
      - run: python3 tools/build_docs.py --check
      - run: python3 -m unittest discover -s tools -p 'test_docs.py'
      - run: python3 tools/validate_design.py
      - run: python3 -m unittest discover -s tools -p 'test_design.py'
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace
      - run: cargo test --locked -p csv-preview --test session -- --ignored

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Add Windows SDK resource compiler
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $compiler) { throw "Windows SDK rc.exe was not found" }
          $compiler.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: cargo fmt --check
      # 07A-13: strict clippy. The deliberate allow-list with reasons lives
      # in the sources (csv-preview/src/windows.rs, csv-protocol/messages.rs),
      # so no lint can return silently.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace
      - run: cargo test --locked -p csv-preview --test session -- --ignored

      - name: Native standalone control smoke
        shell: pwsh
        timeout-minutes: 3
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "MSVC developer tools were not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" >nul && cl /nologo /utf-8 /W3 /Fotarget\native-smoke.obj /Fetarget\native-smoke.exe crates\viewer-shell\tests\native-smoke.c user32.lib comctl32.lib gdi32.lib"
          if ($LASTEXITCODE -ne 0) { throw "Native smoke compilation failed" }
          Copy-Item assets/desktop-fonts target/debug/fonts -Recurse -Force
          New-Item -ItemType Directory -Force target/debug/help | Out-Null
          Copy-Item docs/USER-GUIDE.html target/debug/help/index.html -Force
          & target/native-smoke.exe 'target\debug\csv-desktop.exe' 'crates\csv-core\tests\fixtures\golden.csv' CSV target '007'
          if ($LASTEXITCODE -ne 0) { throw "Native standalone smoke failed" }
          $rows = @('id,note,payload') + (0..599 | ForEach-Object { $note = if ($_ -eq 450) { 'NEEDLE.*' } else { 'ordinary' }; ('{0:D6},{1},payload' -f $_, $note) })
          [IO.File]::WriteAllLines((Join-Path $pwd 'target/pages.csv'), $rows, [Text.UTF8Encoding]::new($false))
          & target/native-smoke.exe 'target\debug\csv-desktop.exe' 'target\pages.csv' CSV target '000000' '--browse'
          if ($LASTEXITCODE -ne 0) { throw "Native paging/search smoke failed" }

      - name: Verify extracted standalone ZIP
        shell: pwsh
        timeout-minutes: 3
        run: |
          python -m unittest discover -s tools -p 'test_packaging.py'
          if ($LASTEXITCODE -ne 0) { throw "Packaging regression tests failed" }
          $parseErrors = $null
          $tokens = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'scripts/build-desktop.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors) { throw "PowerShell package builder has syntax errors: $parseErrors" }
          ./scripts/test-rust-build-flags.ps1
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw "Locked dependency fetch failed" }
          python scripts/generate-third-party-licenses.py --check
          if ($LASTEXITCODE -ne 0) { throw "Third-party licence bundle is stale" }
          python scripts/package-desktop.py --binary-dir target/debug --output-dir target/preview-package --profile debug --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed" }
          $archive = 'target/preview-package/csv-desktop-debug-windows-x64-msvc.zip'
          python scripts/package-desktop.py --verify $archive
          if ($LASTEXITCODE -ne 0) { throw "Packaged checksums failed" }
          $extracted = Join-Path $env:RUNNER_TEMP 'CSV standalone with spaces'
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted
          $desktop = Join-Path $extracted 'csv-desktop.exe'
          & target/native-smoke.exe $desktop 'crates/csv-core/tests/fixtures/golden.csv' CSV target '007'
          if ($LASTEXITCODE -ne 0) { throw "Extracted standalone smoke failed" }
          & target/native-smoke.exe $desktop 'target/pages.csv' CSV target '000000' '--browse'
          if ($LASTEXITCODE -ne 0) { throw "Extracted paging/search smoke failed" }

  # cargo-deny-action is container-based and only runs on Linux (proven by
  # the mh-ticker first CI run, run 41384343756: "Container action is only
  # supported on Linux"); it gets its own job instead of riding the Windows
  # one.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check dependency licences and bans (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans

  # A tag stages a candidate only. Publishing/visibility need separate approval.
  release-candidate:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, deny]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0
        with:
          toolchain: 1.85.0
      - name: Add Windows SDK resource compiler
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $compiler) { throw "Windows SDK rc.exe was not found" }
          $compiler.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build standalone MSVC candidate
        shell: pwsh
        run: ./scripts/build-desktop.ps1
      - name: Keep candidate for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csv-desktop-windows-x64-msvc-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/csv-desktop-release-windows-x64-msvc.zip
            dist/csv-desktop-release-windows-x64-msvc.zip.sha256

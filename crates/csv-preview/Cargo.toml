[package]
name = "csv-preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Bounded preview session and Windows Explorer preview handler"

[lib]
name = "csv_preview"
crate-type = ["rlib", "cdylib"]

[features]
# Type-check the Windows-only module on a non-Windows host (no link/run).
windows-check = []

[dependencies]
csvview-core = { path = "../csv-core" }
csv-protocol = { path = "../csv-protocol" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
